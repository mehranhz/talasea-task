services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "try { const s = rs.status(); if (!s.ok || !s.members.some((m) => m.stateStr === 'PRIMARY')) quit(1); } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}); quit(1); }",
        ]
      interval: 5s
      timeout: 15s
      retries: 30
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    command: ["node", "dist/server.js"]
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017/wallet?replicaSet=rs0
      REDIS_URL: redis://redis:6379

  worker:
    build: .
    command: ["node", "dist/worker.js"]
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017/wallet?replicaSet=rs0
      REDIS_URL: redis://redis:6379

volumes:
  mongo-data:
  redis-data:
